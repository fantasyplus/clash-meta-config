mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true

find-process-mode: always
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

sniffer:
  enable: true
  force-dns-mapping: true
  parse-pure-ip: true
  override-destination: true
  sniff:
    HTTP:
      ports: [80, 8080-8880]
      override-destination: true
    TLS:
      ports: [443, 8443]
    QUIC:
      ports: [443, 8443]
  force-domain:
    - '+.futu.com'
    - '+.futu.cn'
    - '+.futu.link'
    - '+.futu0.com'
    - '+.futu1.com'
    - '+.futu2.com'
    - '+.futu3.com'
    - '+.futu4.com'
    - '+.futu5.com'
    - '+.futu6.com'
    - '+.futu7.com'
    - '+.futu8.com'
    - '+.futu9.com'
    - '+.futunn.com'
    - '+.futuhn.com'
    - '+.futuhk.com'
    - '+.futusg.com'
    - '+.futufin.com'
    - '+.futustatic.com'
    - '+.futuinc.com'
    - '+.futuniuniu.com'
    - '+.futuesop.com'
    - '+.futuie.com'
    - '+.fututrustee.com'
    - '+.futuholdings.com'
    - '+.moomoo.com'
    - '+.moomoocn.com'
    - '+.moomoo.com.au'
    - '+.moomoo.com.sg'
    - '+.moomoo.com.my'
    - '+.moomoo.com.nz'
    - '+.moomoo.co.jp'

proxy-providers:
  airport-clashmeta:
    type: http
    url: "https://acsub.kyapi.xyz/?sid=283482&uid=134955&token=T2xCNFhvTEYyQUVqMU01T1FCeEVjdEMyNVFSaVBNMVV4TmExYmE2Y0FKND0&app=clashmeta"
    path: ./proxy_providers/airport-clashmeta.yaml
    interval: 86400
    exclude-filter: "^(DIRECT|REJECT|GLOBAL)$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: select
    use:
      - airport-clashmeta
    proxies:
      - DIRECT

rules:
  - PROCESS-NAME,cn.futu.trader,PROXY
  - PROCESS-NAME,cn.futu.trader.universal,PROXY
  - PROCESS-NAME,com.futu.trader,PROXY
