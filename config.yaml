mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true

find-process-mode: strict
global-client-fingerprint: chrome

profile:
  store-selected: true
  store-fake-ip: true

proxy-providers:
  airport-clashmeta:
    type: http
    url: "https://acsub.kyapi.xyz/?sid=283482&uid=134955&token=T2xCNFhvTEYyQUVqMU01T1FCeEVjdEMyNVFSaVBNMVV4TmExYmE2Y0FKND0&app=clashmeta"
    path: ./proxy_providers/airport-clashmeta.yaml
    interval: 86400
    exclude-filter: "^(DIRECT|REJECT|GLOBAL)$"
    health-check:
      enable: true
      url: https://www.gstatic.com/generate_204
      interval: 300

proxy-groups:
  - name: PROXY
    type: select
    use:
      - airport-clashmeta
    proxies:
      - DIRECT

rules:
  - PROCESS-NAME,cn.futu.trader,PROXY
  - PROCESS-NAME,com.futu.trader,PROXY
  - PROCESS-NAME,com.moomoo.trade,PROXY
  - DOMAIN-SUFFIX,futunn.com,PROXY
  - DOMAIN-SUFFIX,futu5.com,PROXY
  - DOMAIN-SUFFIX,futuhk.com,PROXY
  - DOMAIN-SUFFIX,futusg.com,PROXY
  - DOMAIN-SUFFIX,futuholdings.com,PROXY
  - DOMAIN-SUFFIX,moomoo.com,PROXY
  - DOMAIN-KEYWORD,futu,PROXY
  - DOMAIN-KEYWORD,moomoo,PROXY
  - GEOIP,CN,DIRECT
  - MATCH,PROXY
